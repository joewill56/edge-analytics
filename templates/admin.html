<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Edge admin</title>
<style>body{font:15px/1.45 system-ui,sans-serif;padding:16px;max-width:520px;margin:auto}
input,select,button,textarea{font:inherit;width:100%;padding:10px;margin:6px 0;box-sizing:border-box}
button{background:#2563eb;color:#fff;border:0;border-radius:8px}small{color:#666}</style></head>
<body>
<h2>Edge admin</h2>
<input id="adm" type="password" placeholder="Admin token (ADMIN_TOKEN on Render)">
<button id="save">Save token on this device</button>
<small>Saving it shows the Retrain button on the main page and API credits left. Do this only on your own phone.</small>
<h3>Create a premium code</h3>
<small>Use this when someone pays you by transfer. Send them the code; they paste it under "Go ad-free".</small>
<input id="email" type="email" placeholder="Customer email (for your records)">
<select id="plan">{% for k,v in plans.items() %}<option value="{{k}}">{{ k.replace('_',' ')|capitalize }} (₦{{ '{:,}'.format(v.ngn) }}, {{v.days}} days)</option>{% endfor %}</select>
<button id="grant">Create code</button>
<textarea id="out" rows="6" readonly></textarea>
<script>
const $=s=>document.querySelector(s);
$('#adm').value=localStorage.getItem('adm')||'';
$('#save').onclick=()=>{localStorage.setItem('adm',$('#adm').value.trim());alert('Saved')};
$('#grant').onclick=async()=>{
  const r=await fetch('/api/admin/grant',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':$('#adm').value.trim()||localStorage.getItem('adm')||''},
    body:JSON.stringify({email:$('#email').value,plan:$('#plan').value})});
  const j=await r.json();
  $('#out').value=r.ok?j.code+'\n\nExpires: '+new Date(j.expires*1000).toLocaleString():(j.error||'Error');
};
</script></body></html>
