<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge — Match Analytics</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0e1116">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Edge">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" href="/static/icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171c;--mute:#6b7280;--line:#e5e7eb;--h:#2563eb;--d:#9ca3af;--a:#e11d48;--good:#059669;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--ink:#e8eaed;--mute:#98a0ab;--line:#262c36;--h:#60a5fa;--d:#6b7280;--a:#fb7185;--good:#34d399;--warn:#fbbf24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;background:var(--bg);padding:12px 14px;border-bottom:1px solid var(--line);z-index:5}
h1{margin:0 0 8px;line-height:0}.logo{height:34px;width:auto;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.primary{background:var(--h);border-color:var(--h);color:#fff}
.tabs button.on{border-color:var(--h);color:var(--h);font-weight:600}
main{padding:12px 14px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.teams{display:flex;justify-content:space-between;font-weight:600;gap:8px}
.when{color:var(--mute);font-size:12px;margin-bottom:6px}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0 2px;font-size:11px;color:#fff}
.bar span{display:flex;align-items:center;justify-content:center;min-width:0}
.lab{font-size:11px;color:var(--mute);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
td,th{padding:4px 2px;text-align:center}th{color:var(--mute);font-weight:500}td:first-child,th:first-child{text-align:left}
.pos{color:var(--good);font-weight:600}.neg{color:var(--mute)}
.badge{display:inline-block;background:var(--good);color:#fff;border-radius:99px;font-size:11px;padding:1px 8px;margin-left:6px}
.note{font-size:12px;color:var(--warn)}
.msg{padding:14px;color:var(--mute);text-align:center}
.metrics{font-size:12px;color:var(--mute)}
.pick{border-radius:10px;padding:10px 12px;margin:8px 0;border:1px solid var(--line)}
.pick b.big{font-size:20px}.pick.high{border-color:var(--good)}.pick.medium{border-color:var(--h)}.pick.none{border-color:var(--warn)}
.pick small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.chip{display:inline-block;border:1px solid var(--good);color:var(--ink);border-radius:99px;padding:2px 9px;margin:4px 4px 0 0;font-size:12px}
details{margin-top:8px;font-size:13px}summary{cursor:pointer;color:var(--h);font-weight:600}
details h4{margin:10px 0 2px;font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase}
details table td:nth-child(2),details table td:nth-child(3){white-space:nowrap}
.locked .lockbox{margin-top:10px;padding:12px;border:1px dashed var(--line);border-radius:10px;text-align:center}
.lockbox small{display:block;color:var(--mute);margin:4px 0 10px}.lockbox .row{justify-content:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal[hidden]{display:none}
#sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 22px}
#sheet h3{margin:0 0 4px}#sheet button,#sheet input{margin-top:8px}
#sheet input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;flex:1}
.plan{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.plan.best{border-color:var(--good)}.price{font-weight:700;text-align:right}.price small{display:block;color:var(--mute);font-weight:400;font-size:11px}
.adbox{height:140px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#e11d48);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;margin:10px 0}
a.btn{display:block;text-align:center;text-decoration:none;background:var(--h);color:#fff;border-radius:8px;padding:10px;margin-top:10px}
#badge{font-size:12px;color:var(--good);font-weight:600}
[dir=rtl] .teams,[dir=rtl] td,[dir=rtl] th{text-align:right}[dir=rtl] td:not(:first-child),[dir=rtl] th:not(:first-child){text-align:center}
.adslot{text-align:center;margin:10px 0}.adslot .lab{margin:0 0 2px}
header input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.plan .price button{display:block;margin:6px 0 0 auto}
#sheet a{color:var(--h)}
main a{color:var(--h)}
.disc{font-size:11px;color:var(--mute);margin-top:18px}
</style>
</head>
<body>
<header>
  <h1><img src="/static/logo-wide.png" alt="Edge Analytics" class="logo"></h1>
  <div class="row">
    <select id="league">{% for k,v in leagues.items() %}<option value="{{k}}">{{v.name}}</option>{% endfor %}</select>
    <span class="tabs row"><button id="t-up" class="on" data-i18n="up">Upcoming</button><button id="t-rt" data-i18n="rt">Ratings</button><button id="t-tr" data-i18n="tr">Track record</button></span>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="goadfree" class="primary" data-i18n="adfree">Go ad-free</button><span id="badge"></span><span id="quota" class="lab"></span>
    <select id="lang" aria-label="Language"></select>
    <button id="refresh" data-i18n="retrain" hidden>Retrain</button><button id="install" class="primary" data-i18n="install" hidden>Install app</button>
  </div>
  <div class="row" style="margin-top:8px"><input id="q" type="search" data-i18n-ph="search_ph" autocomplete="off" style="flex:1;min-width:0"></div>
</header>
<main>
  <div id="metrics" class="metrics"></div>
  <div id="view"><div class="msg">Loading…</div></div>
  <p class="disc" data-i18n="disc"></p>
</main>
<div id="modal" class="modal" hidden><div id="sheet"></div></div>

const t=(k,v)=>{let s=(I18N[S.lang]&&I18N[S.lang][k])||I18N.en[k]||k;if(v)for(const x in v)s=s.replace('{'+x+'}',v[x]);return s};

/* Language rule: English for Nigeria or any English browser; otherwise the browser's language if we have it. */
function detectLang(){
  const saved=ls.get('lang');if(saved&&LANGS[saved])return saved;
  let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}
  if(tz==='Africa/Lagos')return 'en';
  for(const x of (navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en'])){
    const b=String(x).toLowerCase().split('-')[0];
    if(b==='en')return 'en';
    if(LANGS[b])return b;
  }
  return 'en';
}
/* Currency: Nigeria -> naira; otherwise the browser's region; USD if unknown. Visitors can change it in the paywall. */
const CC={NG:'NGN',US:'USD',GB:'GBP',GH:'GHS',KE:'KES',ZA:'ZAR',CA:'CAD',AU:'AUD',IN:'INR',BR:'BRL',AE:'AED',EG:'EGP',TZ:'TZS',UG:'UGX',MA:'MAD',SN:'XOF',CI:'XOF',BJ:'XOF',TG:'XOF',BF:'XOF',ML:'XOF',NE:'XOF',CM:'XAF',GA:'XAF',TD:'XAF',CG:'XAF',FR:'EUR',DE:'EUR',ES:'EUR',IT:'EUR',PT:'EUR',NL:'EUR',BE:'EUR',IE:'EUR',AT:'EUR',FI:'EUR',GR:'EUR',MX:'MXN',SA:'SAR',TR:'TRY',CH:'CHF'};
function detectCur(){
  const saved=ls.get('cur');if(saved)return saved;
  let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}
  if(tz==='Africa/Lagos')return 'NGN';
  for(const x of (navigator.languages||[navigator.language||''])){const r=String(x).split('-')[1];if(r&&CC[r.toUpperCase()])return CC[r.toUpperCase()]}
  return 'USD';
}

/* ---------------- access headers ---------------- */
const hdrs=()=>({'X-Access':ls.get('access')||'','X-Premium':ls.get('premium')||'','X-Admin-Token':ls.get('adm')||''});

/* ---------------- modal ---------------- */
function openModal(html){$('#sheet').innerHTML=html;$('#modal').hidden=false}

$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ---------------- free daily unlocks (no ad needed) ---------------- */
async function unlock(eventId,leagueKey){
  try{
    const r=await fetch('/api/unlock',{method:'POST',headers:{...hdrs(),'Content-Type':'application/json'},body:JSON.stringify({league:leagueKey||$('#league').value,event_id:eventId})});
    const j=await r.json();
    if(r.status===429){alert(t('limit_hit'));openPaywall();return}
    if(!r.ok)throw new Error(j.error||'');
    ls.set('access',j.access);injectPopup();S.query?runSearch(S.query):load();
  }catch(e){alert(t('unlock_err'))}
}
/* Adsterra banners (free users only): each slot is a sandboxed iframe so ad scripts can never redirect or touch the page. */
let adN=0;
function mountAds(){
  const ads=S.ad;if(!ads||!ads.length)return;
  document.querySelectorAll('.adslot:not([data-done])').forEach(el=>{
    const k=adN++%ads.length,d=ads[k];
    const f=document.createElement('iframe');f.src='/ad-frame?i='+k;f.style.border='0';
    f.setAttribute('sandbox','allow-scripts allow-popups allow-popups-to-escape-sandbox');f.setAttribute('loading','lazy');f.setAttribute('title','Advertisement');
    if(d.w){
      const avail=Math.max(200,el.clientWidth||window.innerWidth-28),sc=Math.min(1,avail/d.w);
      f.width=d.w;f.height=d.h;f.style.transform='scale('+sc+')';f.style.transformOrigin='0 0';
      const wrap=document.createElement('div');wrap.style.cssText='width:'+d.w*sc+'px;height:'+d.h*sc+'px;margin:0 auto;overflow:hidden';
      wrap.appendChild(f);el.appendChild(wrap);
    }else{f.style.width='100%';f.height=d.h||300;el.appendChild(f)}
    el.dataset.done='1';
  });
}
function cardsWithAds(j){
  S.ad=(!j.premium||(j.ads&&j.ads.length))&&j.ads&&j.ads.length?j.ads:null;
  const ad=S.ad?`<div class="adslot"><div class="lab">${t('ad_title')}</div></div>`:'';
  return j.events.map((e,i)=>card(e)+(i%3===2?ad:'')).join('')+ad;
}
function addScript(x){const s=document.createElement('script');if(x.src){s.src=x.src;s.async=true}else{s.text=x.code}s.setAttribute('data-cfasync','false');document.body.appendChild(s)}
let popLoaded=false,tagsLoaded=false;
/* Pop-up ad code (e.g. Adsterra Social Bar): loaded once, for free users, right after they unlock a match.
   The unlock never waits for it: nothing is locked behind watching an ad. */
function injectPopup(){
  if(popLoaded||!S.popup||!S.popup.length)return;popLoaded=true;S.popup.forEach(addScript);
}
/* Network tag code (e.g. Monetag): loaded once on page load, for free users only. */
function injectTags(){
  if(tagsLoaded||!S.tags||!S.tags.length)return;tagsLoaded=true;S.tags.forEach(addScript);
}
function headerState(j){
  S.popup=j.popup||[];S.tags=j.tags||[];injectTags();
  $('#goadfree').hidden=!!j.premium;
  $('#badge').textContent=j.admin?'Admin · full access':(j.premium?t('prem_badge',{d:new Date(j.premium_until*1000).toLocaleDateString(S.lang)}):'');
  $('#quota').textContent=(!j.premium&&j.quota)?t('free_left',{n:Math.max(0,j.quota.limit-j.quota.used)}):'';
}
/* ---------------- search (looks only at leagues already loaded on the server) ---------------- */
S.query='';
async function runSearch(q){
  S.query=q;
  if(q.length<2){S.query='';load();return}
  if(tab!=='up'){tab='up';['up','rt','tr'].forEach(k=>$('#t-'+k).classList.toggle('on',k==='up'))}
  $('#view').innerHTML=`<div class="msg">${t('loading')}</div>`;
  try{S.sj=await (await fetch('/api/search?q='+encodeURIComponent(q)+AT,{headers:hdrs()})).json()}catch(e){S.sj={events:[],searched:0}}
  renderSearch();
}
function renderSearch(){
  const j=S.sj,v=$('#view');if(!j)return;
  headerState(j);$('#metrics').textContent='';
  v.innerHTML=(j.events&&j.events.length)?cardsWithAds(j):`<div class="msg">${t(j.searched?'search_none':'search_none2')}</div>`;
  mountAds();
}

async function ensurePricing(){if(!S.pricing){try{S.pricing=await (await fetch('/api/pricing')).json()}catch(e){S.pricing={plans:{},rates:{}}}}return S.pricing}
function money(ngn){
  const nf=(c,d)=>new Intl.NumberFormat(S.lang,{style:'currency',currency:c,maximumFractionDigits:d}).format;
  const base=nf('NGN',0)(ngn), rate=S.pricing.rates&&S.pricing.rates[S.cur];
  if(S.cur==='NGN'||!rate)return base;
  const v=ngn*rate;return `≈ ${nf(S.cur,v<10?2:0)(v)}<small>${base}</small>`;
}

  <div id="restorebox" hidden><input id="restoremail" type="email" inputmode="email" autocomplete="email" placeholder="${t('pay_email_ph')}" style="width:100%;box-sizing:border-box"><input id="restoreref" placeholder="${t('restore_ref_ph')}" autocomplete="off" style="width:100%;box-sizing:border-box"><button id="restorego" class="primary" style="width:100%">${t('restore_go')}</button><div id="restoremsg" class="lab note"></div></div>
  <button id="closem" style="width:100%">${t('ad_close')}</button>`);
  $('#cursel').onchange=e=>{S.cur=e.target.value;ls.set('cur',S.cur);openPaywall()};
  $('#closem').onclick=closeModal;
  document.querySelectorAll('#sheet [data-plan]').forEach(b=>b.onclick=async()=>{
    const em=($('#payemail').value||'').trim();S.payemail=em;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(em)){$('#paymsg').textContent=t('email_bad');return}
    b.disabled=true;$('#paymsg').textContent=t('loading');
    try{
      const r=await fetch('/api/pay/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,plan:b.dataset.plan})});
      const j=await r.json();if(!r.ok||!j.link)throw new Error(j.error||t('pay_err'));
      location.href=j.link;
    }catch(e){$('#paymsg').textContent=e.message||t('pay_err');b.disabled=false}
  });
  $('#applycode').onclick=async()=>{
    let c=$('#code').value.trim();if(!c)return;
    if(/^edge-/i.test(c))c=c.toUpperCase();
    const j=await (await fetch('/api/me',{headers:{'X-Premium':c}})).json();
    if(j.premium){ls.set('premium',c);closeModal();load()}else $('#codemsg').textContent=t('code_bad');
  };
  $('#restorelink').onclick=e=>{e.preventDefault();$('#restorebox').hidden=false};
  $('#restorego').onclick=async()=>{
    const em=($('#restoremail').value||'').trim(),ref=($('#restoreref').value||'').trim(),m=$('#restoremsg');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(em)){m.textContent=t('email_bad');return}
    try{
      const r=await fetch('/api/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,tx_ref:ref})});
      const j=await r.json();
      if(j.code){ls.set('premium',j.code);closeModal();load();return}
      m.textContent=!r.ok?(j.error||t('pay_err')):(j.emailed?t('restore_sent'):t('restore_off'));
    }catch(e){m.textContent=t('pay_err')}
  };
}


/* ---------------- rendering ---------------- */
function backtest(m){
  if(!m||!m.markets)return '';
  const rows=Object.values(m.markets).filter(x=>x.n70>=20).sort((a,b)=>b.hit70-a.hit70);
  const o=m.over25_vs_market;
  return `<details class="card"><summary>Market backtest (past matches)</summary><table><tr><th>Market</th><th>Rated 70%+</th><th>Actually hit</th></tr>${rows.map(x=>`<tr><td>${esc(x.label)}</td><td>${x.n70}</td><td class="${x.hit70>=0.68?'pos':'neg'}">${pct(x.hit70)}</td></tr>`).join('')||'<tr><td colspan=3>Not enough data</td></tr>'}</table>
  <div class="lab">If "actually hit" is clearly below 70%, the model is overconfident for that market. Treat it with caution.</div>
  ${o?`<div class="lab">Over/Under 2.5 accuracy score vs bookmakers (lower is better): model ${o.model} vs market ${o.market} over ${o.n} matches.</div>`:''}</details>`;
}
function bar(p){return `<div class="bar"><span style="width:${p[0]*100}%;background:var(--h)">${pct(p[0])}</span><span style="width:${p[1]*100}%;background:var(--d)">${pct(p[1])}</span><span style="width:${p[2]*100}%;background:var(--a)">${pct(p[2])}</span></div>`}
const fmtWhen=e=>(e.league?esc(e.league)+' · ':'')+new Date(e.commence).toLocaleString(S.lang,{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' · '+e.books+' '+t('books');

function lockedCard(e){
  return `<div class="card locked"><div class="when">${fmtWhen(e)}</div>
  <div class="teams"><span>${esc(e.home)}</span><span style="text-align:right">${esc(e.away)}</span></div>
  <div class="lockbox"><b>🔒 ${t('locked_t')}</b><small>${t('locked_d')}</small>
  <div class="row"><button class="primary" data-unlock="${esc(e.id)}" data-league="${esc(e.league_key||'')}">${t('watch')}</button><button data-paywall>${t('adfree')}</button></div></div></div>`;
}
function card(e){
  if(e.locked)return lockedCard(e);
  const m=e.model;
  const bestEv=m&&m.ev?Math.max(...m.ev):null, bi=m&&m.ev?m.ev.indexOf(bestEv):-1;
  const name=[t('home'),t('draw'),t('away')];
  let h=`<div class="card"><div class="when">${fmtWhen(e)}</div>
  <div class="teams"><span>${esc(e.home)}</span><span style="text-align:right">${esc(e.away)}</span></div>`;
  const pk=e.pick;
  if(pk){
    h+= pk.code==='SKIP'
      ? `<div class="pick none"><b class="big">${t('skip')}</b><small>${t('skipwhy',{p:pct(pk.prob)})}</small></div>`
      : `<div class="pick ${pk.level}"><b class="big">${pk.code}</b> · ${t('pk_'+pk.code)} <span class="badge">${pct(pk.prob)}</span>
         <small>${pk.level==='high'?t('conf_high'):t('conf_med')} · ${t('worth',{o:pk.fair_odds.toFixed(2)})}</small></div>`;
  }
  if(e.markets){
    const mk=e.markets;
    h+=`<div class="lab">${t('xg')}: <b>${mk.xg[0]} – ${mk.xg[1]}</b></div>`;
    h+=mk.top.length?`<div class="lab">${t('topmk')}</div>${mk.top.map(x=>`<span class="chip">${esc(x.label)} · ${pct(x.prob)} · ${t('minodds')} ${x.odds.toFixed(2)}</span>`).join('')}`:`<div class="lab note">${t('nomk')}</div>`;
    if(mk.groups)h+=`<details><summary>${t('allmk')}</summary>${Object.entries(mk.groups).map(([g,items])=>`<h4>${t('g_'+g)}</h4><table>${items.map(i=>`<tr><td>${esc(i.label)}</td><td>${pct(i.prob)}${i.push!==undefined?` <span class="lab">(${pct(i.push)})</span>`:''}</td><td>${i.odds?i.odds.toFixed(2):'-'}</td></tr>`).join('')}</table>`).join('')}<h4>${t('scores')}</h4><div>${(mk.scores||[]).map(s=>`<span class="chip" style="border-color:var(--line)">${s.score} · ${pct(s.prob)}</span>`).join('')}</div></details>`;
  }
  if(m){
    h+=`<div class="lab">${t('model')}${m.low_data?` <span class="note">· ${t('lowdata')}</span>`:''}</div>${bar(m.probs)}<div class="lab">${t('blended')}</div>${bar(m.blend)}`;
  }else h+=`<div class="lab note">${t('nomodel')}</div>`;
  h+=`<div class="lab">${t('market')}</div>${bar(e.market)}`;
  h+=`<table><tr><th></th><th>${t('home')}</th><th>${t('draw')}</th><th>${t('away')}</th></tr>
  <tr><td>${t('bestodds')}</td>${e.best.map(b=>`<td title="${esc(b.book)}">${b.odds.toFixed(2)}</td>`).join('')}</tr>`;
  if(m&&m.ev)h+=`<tr><td>${t('ev')}</td>${m.ev.map(v=>`<td class="${v>0?'pos':'neg'}">${v>0?'+':''}${(v*100).toFixed(1)}%</td>`).join('')}</tr>`;
  h+=`</table>`;
  if(m&&m.ev&&bestEv>0.03)h+=`<div class="lab"><b>${t('edgeline',{n:name[bi]})}</b><span class="badge">+${(bestEv*100).toFixed(1)}% EV</span></div>`;
  if(e.level==='free')h+=`<div class="lab note">${t('up_free')} <a href="#" data-paywall>${t('adfree')}</a></div>`;
  else if(e.level==='basic')h+=`<div class="lab note">${t('up_basic')} <a href="#" data-paywall>${t('adfree')}</a></div>`;
  return h+`</div>`;
}
function renderUp(){
  const j=S.j,v=$('#view');if(!j)return;
  const mt=j.metrics;
  $('#metrics').textContent=mt?`Backtest: model log-loss ${mt.log_loss}${mt.market_log_loss?` vs market ${mt.market_log_loss}`:''}${mt.blend_log_loss?` · blended ${mt.blend_log_loss}`:''} · accuracy ${pct(mt.accuracy)}${j.meta&&j.meta.remaining!=null?` · API credits left: ${j.meta.remaining}`:''}`:'';
  headerState(j);
  if(!S.ok){v.innerHTML=`<div class="msg">${esc(j.error||'Error')}${j.trained===false?'<br>Model not trained yet.':''}</div>`;return}
  v.innerHTML=(j.events.length?cardsWithAds(j):`<div class="msg">${t('nomatches')}</div>`)+backtest(j.metrics);mountAds();
}

async function load(force=false){
  const lg=$('#league').value, v=$('#view');
  v.innerHTML=`<div class="msg">${t('loading')}</div>`;
  if(tab==='tr'){
    $('#metrics').textContent='';
    const res=await fetch('/api/track'), tj=await res.json();
    if(!res.ok){v.innerHTML=`<div class="msg">${esc(tj.error||'Error')}</div>`;return}
    const o=tj.overall, lab={'1':'Home win','2':'Away win','X':'Draw','1X':'Home or Draw','X2':'Away or Draw','12':'Home or Away'};
    let x='';
    if(tj.storage==='temporary'&&ls.get('adm'))x+=`<div class="card note">History is stored temporarily on this host and resets when the site restarts. Add a free Postgres DATABASE_URL to keep it permanently.</div>`;
    x+=`<div class="card"><b>Overall (settled picks)</b>`+(o.settled?`<table><tr><td>Picks settled</td><td>${o.settled}</td></tr><tr><td>Won</td><td>${o.wins}</td></tr><tr><td>Actual hit rate</td><td><b>${pct(o.hit_rate)}</b></td></tr><tr><td>Model expected</td><td>${pct(o.avg_predicted)}</td></tr></table><div class="lab">If actual is well below expected, the model is overconfident. ${o.settled<100?'Fewer than 100 picks is too few to judge.':''}</div>`:`<div class="lab">No settled picks yet. Picks are locked before kickoff and settle after the match once results are published.</div>`)+`</div>`;
    const types=Object.entries(tj.by_type);
    if(types.length)x+=`<div class="card"><b>By pick type</b><table><tr><th>Pick</th><th>Played</th><th>Won</th><th>Actual</th><th>Expected</th></tr>${types.map(([k,b])=>`<tr><td>${k} · ${lab[k]}</td><td>${b.settled}</td><td>${b.wins}</td><td>${pct(b.hit_rate)}</td><td>${pct(b.avg_predicted)}</td></tr>`).join('')}</table></div>`;
    if(tj.singles_roi)x+=`<div class="card"><b>Straight picks (1 / X / 2)</b><div class="lab">Flat 1 unit at best odds seen: ${tj.singles_roi.bets} bets, ROI <b class="${tj.singles_roi.roi>=0?'pos':'neg'}">${(tj.singles_roi.roi*100).toFixed(1)}%</b>. Double-chance ROI is not shown because real double-chance odds are not fetched.</div></div>`;
    if(tj.recent.length)x+=`<div class="card"><b>Recent results</b> <span class="lab">(${tj.pending} pending)</span><table>${tj.recent.map(r=>`<tr><td style="text-align:left">${esc(r.home)} v ${esc(r.away)}<div class="lab">${new Date(r.commence).toLocaleDateString(S.lang,{day:'numeric',month:'short'})} · ${r.pick_code} · ${pct(r.pick_prob)}</div></td><td>${r.score||''}</td><td class="${r.status==='won'?'pos':'neg'}">${r.status}</td></tr>`).join('')}</table></div>`;
    v.innerHTML=x;return;
  }
  if(tab==='rt'){
    const r=await (await fetch('/api/ratings?league='+lg)).json();
    v.innerHTML=r.ratings.length?`<div class="card"><table><tr><th>#</th><th>Team</th><th>Elo</th></tr>${r.ratings.map((x,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${esc(x.team)}</td><td>${x.elo}</td></tr>`).join('')}</table></div>`:'<div class="msg">No ratings yet.</div>';
    return;
  }
  const res=await fetch('/api/predictions?league='+lg+(force?'&force=1':'')+AT,{headers:hdrs()});
  S.j=await res.json();S.ok=res.ok;renderUp();
}

async function retrain(){
  const b=$('#refresh');b.disabled=true;
  const r=await fetch('/api/refresh?league='+$('#league').value,{method:'POST',headers:{'X-Admin-Token':ls.get('adm')||''}});
  if(r.status===401){b.disabled=false;alert('Admin token missing or wrong. Open /admin to save it.');return}
  const poll=setInterval(async()=>{
    const s=await (await fetch('/api/status')).json();
    b.textContent=s.running?s.message:t('retrain');
    if(!s.running){clearInterval(poll);b.disabled=false;b.textContent=t('retrain');load()}
  },1500);
}

/* ---------------- wiring ---------------- */
S.lang=detectLang();S.cur=detectCur();
$('#lang').innerHTML=Object.entries(LANGS).map(([k,n])=>`<option value="${k}" ${k===S.lang?'selected':''}>${n}</option>`).join('');
$('#lang').onchange=e=>{S.lang=e.target.value;ls.set('lang',S.lang);applyLang()};
$('#league').onchange=()=>{S.query='';$('#q').value='';load()};
$('#refresh').onclick=retrain;
$('#refresh').hidden=!ls.get('adm');
$('#goadfree').onclick=openPaywall;
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);const q=e.target.value.trim();qt=setTimeout(()=>runSearch(q),500)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(qt);runSearch(e.target.value.trim())}});
$('#view').addEventListener('click',e=>{
  const u=e.target.closest('[data-unlock]');if(u){unlock(u.dataset.unlock,u.dataset.league);return}
  if(e.target.closest('[data-paywall]')){e.preventDefault();openPaywall()}
});
function setTab(x){S.query='';$('#q').value='';tab=x;['up','rt','tr'].forEach(k=>$('#t-'+k).classList.toggle('on',k===x));load()}
$('#t-up').onclick=()=>setTab('up');$('#t-rt').onclick=()=>setTab('rt');$('#t-tr').onclick=()=>setTab('tr');
document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
applyStatic();
load();

// PWA: register service worker + custom install button
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#install').hidden=false});
$('#install').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('#install').hidden=true};
window.addEventListener('appinstalled',()=>{$('#install').hidden=true});
</script>
